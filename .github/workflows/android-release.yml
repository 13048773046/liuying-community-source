name: android-release

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: '版本名，例如 0.9.64'
        required: true
        default: '0.9.64'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_SIGNATURE_SHA256: ${{ secrets.EXPECTED_SIGNATURE_SHA256 }}
        run: |
          set -o pipefail
          flutter pub get
          flutter build apk --release
          APK=$(find build/app/outputs/flutter-apk -name 'app-release.apk' | head -1)
          cp "$APK" "liuying-community-${{ inputs.build_name }}.apk"
          sha256sum "liuying-community-${{ inputs.build_name }}.apk" | tee SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            liuying-community-${{ inputs.build_name }}.apk
            SHA256.txt
          if-no-files-found: error

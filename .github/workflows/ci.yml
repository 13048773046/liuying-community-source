name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime deps
        run: python3 -m pip install --upgrade pip pillow
      - name: Compile
        run: python3 -m py_compile community/server.py community/app.py community/routes.py community/core/*.py
      - name: Architecture tests
        run: python3 -m unittest community/tests/test_architecture.py -v

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze lib test --no-fatal-infos --no-fatal-warnings
